# See https://fly.io/docs/reference/configuration/
app = "tool-compass-gateway"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"
  target = "mcp-gateway"

[env]
  PORT = "8080"
  PYTHONUNBUFFERED = "1"
  # ci-infra-01: gateway.py's _run_http defaults HOST to 127.0.0.1 (loopback);
  # without this the deployed machine binds loopback and Fly's proxy/health
  # checks (see [[http_service.checks]] below) can never reach /health. Binding
  # 0.0.0.0 is the documented reverse-proxy path — Fly's authenticated edge +
  # force_https sit in front, matching gateway.py's stated requirement.
  HOST = "0.0.0.0"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
